services:
  # バックエンドサービス (FastAPI)
  backend:
    build: ./backend
    container_name: mikuops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # フロントエンドサービス (React + Vite)
  frontend:
    build: ./frontend
    container_name: mikuops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

  # リバースプロキシ (Nginx)
  nginx:
    image: nginx:latest
    container_name: mikuops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    restart: always

  # 監視システム (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: mikuops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # 可視化ツール (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: mikuops-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus

    restart: always

volumes:
  grafana-storage: